# Static marketing site. Listens dual-stack: Railway's private DNS is AAAA-only,
# so an IPv4-only listener is unreachable from the edge proxy.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve /terms and /privacy as well as /terms.html — the footer links use
    # the .html form today, but bare paths are what people type.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Fingerprinted images can be cached hard; HTML must not be, so a copy
    # change is visible on the next request.
    location ~* \.(jpg|jpeg|png|svg|webp|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
